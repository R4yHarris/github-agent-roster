schema: 1
# First documented profile: vllm-local (vLLM OpenAI API on DGX Spark).
# Set llm.base_url to http://127.0.0.1:8000/v1 and llm.model to a served ID.
# Keep llm.profile empty; only the named profiles below are selectable.
llm:
  base_url: ""          # empty = deterministic stub
  model: ""
  api_key_env: ROSTER_API_KEY
  effort: m             # l|m|h|x
  context_max: 0        # 0 = unknown
  profile: ""            # ollama|lmstudio|openai; empty uses base_url
profiles:
  ollama:
    base_url: http://127.0.0.1:11434/v1
    api_key_env: ROSTER_API_KEY
  lmstudio:
    base_url: http://127.0.0.1:1234/v1
    api_key_env: ROSTER_API_KEY
  openai:
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
planner:
  turn_budget: 2         # maximum planner responses; no file tools
seat:
  id: coder
  principal: coder      # contracts role; no merge, no deploy
  turn_budget: 8
  tools: [read_file, write_file, list_dir, run_test]
paths:
  memory: .roster/memory/coder.jsonl
  skills: skills
  asks: .roster/asks
  worktrees: .worktrees
