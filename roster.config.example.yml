schema: 1
# First named profile: vllm-local (vLLM OpenAI API on DGX Spark).
# Select it and set llm.model to the HF handle that vLLM is serving.
# The example leaves the profile unset for the deterministic stub.
llm:
  base_url: ""          # empty = deterministic stub
  model: ""
  api_key_env: ROSTER_API_KEY
  effort: m             # fallback l|m|h|x|none; mode selects defaults
  # effort_override: x   # optional explicit choice; /effort writes this
  context_max: 0        # 0 = unknown
  profile: ""            # vllm-local|ollama|lmstudio|openai; empty uses base_url
  # request_timeout_ms: 1200000  # optional; local defaults 20m, cloud 120s
profiles:
  vllm-local:
    base_url: http://127.0.0.1:8000/v1
    api_key_env: ROSTER_API_KEY
    api_key_optional: true
  ollama:
    base_url: http://127.0.0.1:11434/v1
    api_key_env: ROSTER_API_KEY
  lmstudio:
    base_url: http://127.0.0.1:1234/v1
    api_key_env: ROSTER_API_KEY
  openai:
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
planner:
  turn_budget: 32        # maximum planner responses; no file tools
seat:
  id: coder
  principal: coder      # contracts role; no merge, no deploy
  max_attempts: 3        # opt-in --attempts cap; normal runs still use one
  turn_budget: 1000
  context_chars: 200000  # context-pack budget in characters, not tokens
  evidence_workspace: false # carry host-validated acceptance state across coder handoffs
  tools: [read_file, write_file, list_dir, run_test, search_text]
paths:
  memory: .roster/memory/coder.jsonl
  skills: skills
  asks: .roster/asks
  worktrees: .worktrees
publish:
  enabled: true          # permits explicit App publication, not a policy grant
tools:
  internet: false        # stored preference only; no internet tool exists
  run_test: true         # disables both model and automatic tests when false
reviewer:
  required: true         # gate publication on REVIEW.md unless explicitly skipped
# start:                 # how new task branches begin (defaults shown)
#   base: trunk          # trunk = fresh origin/<default>; current = caller HEAD; or a ref
#   sync: fetch          # fetch origin first; offline skips it (freshness unknown)
