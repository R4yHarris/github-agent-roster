version: 1
ask: issue:N
seats:
  - id: planner
    principal: coder
    worker: builtin
    sequence: [read_ask, plan, write_task]
  - id: coder
    principal: coder
    worker: builtin
    sequence: [load_context, implement, run_tests, summarize]
  - id: reviewer
    principal: reviewer
    worker: builtin
    sequence: [read_diff, check_acceptance, write_review]
